[project]
name = "progress-tests"
version = "0.1.0"
description = "Write progressive tests: ordered, deterministic checks that track and document real-world progress toward a desired state."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
progress-tests = "progress_tests.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors (PEP 8 style issues)
    "F",  # pyflakes (unused imports/variables, undefined names, etc.)
    "I",  # isort (import sorting/grouping)
    "UP", # pyupgrade (flags syntax that should use newer Python idioms)
    "B",  # flake8-bugbear (likely bugs and common design footguns)
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]
